# AgentJira — Supabase CLI local config.
# Reference: https://supabase.com/docs/guides/local-development/cli/config

project_id = "agentjira"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

# Local mail catcher (auth emails land here, not in real inboxes).
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# Email/password auth only; no confirmation round-trip for local dev.
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"

# github-sync authenticates via the x-agentjira-secret header (project webhook
# secret), not a Supabase JWT — the caller is a GitHub Actions workflow.
[functions.github-sync]
verify_jwt = false
