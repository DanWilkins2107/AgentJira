# AgentJira PR loop — install as .github/workflows/agentjira.yml in each project repo.
# Repo secrets required: AGENTJIRA_SYNC_URL, AGENTJIRA_SECRET (see gha/README.md).
name: AgentJira

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  pull_request_review:
    types: [submitted]

jobs:
  # Reports PR state to the AgentJira github-sync Edge Function.
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Extract AgentJira node marker
        id: marker
        env:
          # PR body is untrusted input — pass it via env, never interpolate into the script.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          NODE_ID="$(printf '%s' "$PR_BODY" \
            | grep -oE 'AgentJira-Node: [0-9a-fA-F-]{36}' \
            | tail -1 \
            | cut -d' ' -f2 \
            || true)"
          if [ -z "$NODE_ID" ]; then
            echo "No AgentJira-Node marker in PR body; skipping."
            echo 'found=false' >> "$GITHUB_OUTPUT"
          else
            echo "Found node: $NODE_ID"
            echo 'found=true' >> "$GITHUB_OUTPUT"
            echo "node_id=$NODE_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Report PR state to AgentJira
        if: steps.marker.outputs.found == 'true'
        env:
          NODE_ID: ${{ steps.marker.outputs.node_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          REVIEW_STATE: ${{ github.event.review.state }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          AGENTJIRA_SYNC_URL: ${{ secrets.AGENTJIRA_SYNC_URL }}
          AGENTJIRA_SECRET: ${{ secrets.AGENTJIRA_SECRET }}
        run: |
          ACTION=''
          SHA=''
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            case "$EVENT_ACTION" in
              opened|reopened|ready_for_review)
                ACTION='pr_opened'
                ;;
              closed)
                if [ "$MERGED" = 'true' ]; then
                  ACTION='pr_merged'
                  SHA="$MERGE_SHA"
                else
                  ACTION='pr_closed'
                fi
                ;;
            esac
          elif [ "$EVENT_NAME" = 'pull_request_review' ]; then
            if [ "$REVIEW_STATE" = 'approved' ]; then
              ACTION='pr_approved'
            fi
          fi
          if [ -z "$ACTION" ]; then
            echo "Nothing to report for $EVENT_NAME/$EVENT_ACTION; skipping."
            exit 0
          fi
          PAYLOAD="$(jq -n \
            --arg node_id "$NODE_ID" \
            --arg action "$ACTION" \
            --arg pr_url "$PR_URL" \
            --argjson pr_number "$PR_NUMBER" \
            --arg repo "$REPO" \
            --arg actor "$ACTOR" \
            --arg merge_sha "$SHA" \
            '{node_id: $node_id, action: $action, pr_url: $pr_url,
              pr_number: $pr_number, repo: $repo, actor: $actor}
             + (if $merge_sha != "" then {merge_sha: $merge_sha} else {} end)')"
          echo "Reporting $ACTION for node $NODE_ID"
          curl -fsS -X POST "$AGENTJIRA_SYNC_URL" \
            -H 'Content-Type: application/json' \
            -H "x-agentjira-secret: $AGENTJIRA_SECRET" \
            -d "$PAYLOAD"

  # On GitHub approval: wait for checks, merge, report pr_merged with the merge SHA.
  merge:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      contains(github.event.pull_request.body, 'AgentJira-Node:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Extract AgentJira node marker
        id: marker
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          NODE_ID="$(printf '%s' "$PR_BODY" \
            | grep -oE 'AgentJira-Node: [0-9a-fA-F-]{36}' \
            | tail -1 \
            | cut -d' ' -f2 \
            || true)"
          if [ -z "$NODE_ID" ]; then
            echo "No valid AgentJira-Node marker in PR body; skipping."
            echo 'found=false' >> "$GITHUB_OUTPUT"
          else
            echo 'found=true' >> "$GITHUB_OUTPUT"
            echo "node_id=$NODE_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for checks to pass
        if: steps.marker.outputs.found == 'true'
        env:
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          DEADLINE=$(( $(date +%s) + 1200 ))   # ~20 min
          while true; do
            # Exclude this workflow's own jobs (report/merge) or we'd wait on ourselves.
            RUNS="$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --paginate \
              -q '.check_runs[] | select(.name != "report" and .name != "merge")
                  | {name: .name, status: .status, conclusion: .conclusion}' \
              | jq -s '.')"
            TOTAL="$(jq 'length' <<<"$RUNS")"
            if [ "$TOTAL" -eq 0 ]; then
              echo 'No check runs on head commit; treating as pass.'
              break
            fi
            FAILED="$(jq '[.[] | select(.status == "completed"
              and (.conclusion | IN("success","neutral","skipped") | not))] | length' <<<"$RUNS")"
            if [ "$FAILED" -gt 0 ]; then
              echo 'One or more checks failed:'
              jq -r '.[] | "\(.name): \(.status)/\(.conclusion)"' <<<"$RUNS"
              exit 1
            fi
            PENDING="$(jq '[.[] | select(.status != "completed")] | length' <<<"$RUNS")"
            if [ "$PENDING" -eq 0 ]; then
              echo "All $TOTAL checks completed successfully."
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "Timed out waiting for $PENDING pending check(s)."
              exit 1
            fi
            echo "$PENDING of $TOTAL checks still pending; sleeping 30s..."
            sleep 30
          done

      - name: Verify mergeable and merge
        if: steps.marker.outputs.found == 'true'
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # mergeable starts UNKNOWN while GitHub computes it; retry briefly.
          for i in 1 2 3 4 5 6; do
            MERGEABLE="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergeable -q '.mergeable')"
            if [ "$MERGEABLE" != 'UNKNOWN' ]; then
              break
            fi
            sleep 10
          done
          if [ "$MERGEABLE" != 'MERGEABLE' ]; then
            echo "PR #$PR_NUMBER is not mergeable (state: $MERGEABLE)."
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash

      - name: Report pr_merged to AgentJira
        if: steps.marker.outputs.found == 'true'
        env:
          NODE_ID: ${{ steps.marker.outputs.node_id }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ACTOR: ${{ github.actor }}
          AGENTJIRA_SYNC_URL: ${{ secrets.AGENTJIRA_SYNC_URL }}
          AGENTJIRA_SECRET: ${{ secrets.AGENTJIRA_SECRET }}
        run: |
          MERGE_SHA="$(gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json mergeCommit -q '.mergeCommit.oid')"
          PAYLOAD="$(jq -n \
            --arg node_id "$NODE_ID" \
            --arg pr_url "$PR_URL" \
            --argjson pr_number "$PR_NUMBER" \
            --arg repo "$REPO" \
            --arg merge_sha "$MERGE_SHA" \
            --arg actor "$ACTOR" \
            '{node_id: $node_id, action: "pr_merged", pr_url: $pr_url,
              pr_number: $pr_number, repo: $repo, merge_sha: $merge_sha, actor: $actor}')"
          echo "Reporting pr_merged for node $NODE_ID (sha $MERGE_SHA)"
          curl -fsS -X POST "$AGENTJIRA_SYNC_URL" \
            -H 'Content-Type: application/json' \
            -H "x-agentjira-secret: $AGENTJIRA_SECRET" \
            -d "$PAYLOAD"
